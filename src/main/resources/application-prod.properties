# =======================================================
# CivicConnect - Production Cloud Configuration (Render, Railway, AWS)
# =======================================================

# Server: Dynamic Port Assignment from PaaS environment (e.g. Render / Railway $PORT)
server.port=${PORT:8080}
server.servlet.session.timeout=60m

# Database Configuration with Zero-Failover Fallback:
# Uses MySQL if DB_URL / MYSQL_URL is configured; otherwise safely runs production embedded database
spring.datasource.url=${DB_URL:${MYSQL_URL:jdbc:h2:file:/tmp/civicconnect_prod_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE}}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# Thymeleaf caching for high-performance production serving
spring.thymeleaf.cache=true

# Production Uploads Directory (Ephemeral /tmp or Persistent Disk)
app.upload.dir=${UPLOAD_DIR:/tmp/uploads}
app.upload.allowed-types=image/jpeg,image/png,image/gif,image/webp
app.upload.max-size=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Default Admin Credentials
app.admin.default-email=${ADMIN_EMAIL:admin@civicconnect.com}
app.admin.default-password=${ADMIN_PASSWORD:Admin@123}

# Duplicate Detection Tuning
app.duplicate.similarity-threshold=0.6
app.duplicate.proximity-radius-km=0.5
app.duplicate.max-results=5

# Logging: Clean production output
logging.level.root=INFO
logging.level.com.civicconnect=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
