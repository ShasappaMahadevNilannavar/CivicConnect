# =======================================================
# CivicConnect - Production Cloud Configuration (Render, Railway, AWS)
# =======================================================

# Server: Dynamic Port Assignment from PaaS environment (e.g. Render / Railway $PORT)
server.port=${PORT:8080}
server.servlet.session.timeout=60m

# Database Configuration with Multi-Cloud & Zero-Failover Fallback:
# Supports DB_URL, MYSQL_URL, DATABASE_URL, SPRING_DATASOURCE_URL
# Automatically falls back to high-resilience production embedded H2 if no external DB is configured
spring.datasource.url=${DB_URL:${MYSQL_URL:${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/civicconnect_prod_db;DB_CLOSE_DELAY=-1;MODE=MySQL}}}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:${SPRING_DATASOURCE_USERNAME:sa}}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}

# Do not force a driver class name - Spring Boot automatically detects from the JDBC URL prefix
# (com.mysql.cj.jdbc.Driver for MySQL, org.h2.Driver for H2, org.postgresql.Driver for PostgreSQL)

# JPA & Hibernate: Auto-create and update tables based on active database dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true
spring.sql.init.mode=never

# Thymeleaf caching for high-performance production serving
spring.thymeleaf.cache=true

# Production Uploads Directory (Local ./uploads or Cloud Persistent Disk)
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.allowed-types=image/jpeg,image/png,image/gif,image/webp
app.upload.max-size=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Default Admin Credentials
app.admin.default-email=${ADMIN_EMAIL:admin@civicconnect.com}
app.admin.default-password=${ADMIN_PASSWORD:Admin@123}

# Duplicate Detection Tuning
app.duplicate.similarity-threshold=0.6
app.duplicate.proximity-radius-km=0.5
app.duplicate.max-results=5

# Logging: Clean production output
logging.level.root=INFO
logging.level.com.civicconnect=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
