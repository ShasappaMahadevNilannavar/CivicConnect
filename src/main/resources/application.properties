# ========================
# CivicConnect Configuration
# ========================

# Server
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/civicconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# spring.datasource.driver-class-name is auto-detected from the JDBC URL

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Hibernate automatically selects the optimal dialect based on the active datasource
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.allowed-types=image/jpeg,image/png,image/gif,image/webp
app.upload.max-size=5242880

# Logging
logging.level.com.civicconnect=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Application
app.name=CivicConnect
app.version=1.0.0
app.admin.default-email=${ADMIN_EMAIL:admin@civicconnect.com}
app.admin.default-password=${ADMIN_PASSWORD:Admin@123}

# Duplicate Detection
app.duplicate.similarity-threshold=0.6
app.duplicate.proximity-radius-km=0.5
app.duplicate.max-results=5
