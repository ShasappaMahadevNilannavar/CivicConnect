<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>My Profile - CivicConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Header Navigation -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-4 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="d-flex align-items-center mb-3">
                    <a th:href="@{/citizen/dashboard}" class="text-decoration-none text-muted small me-3">
                        <i class="fas fa-arrow-left"></i> Dashboard
                    </a>
                    <h3 class="fw-bold mb-0">Citizen Profile</h3>
                </div>

                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i> <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
                    <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
                        <div class="user-avatar-circle bg-success text-white p-3 rounded-circle me-3" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; font-size: 24px;">
                            <i class="fas fa-user"></i>
                        </div>
                        <div>
                            <h5 class="fw-bold mb-0" th:text="${user.name}">John Citizen</h5>
                            <span class="badge bg-success-subtle text-success" th:text="${user.role}">CITIZEN</span>
                            <small class="text-muted d-block mt-1">
                                Member since <span th:text="${#temporals.format(user.createdAt, 'MMM yyyy')}">Nov 2026</span>
                            </small>
                        </div>
                    </div>

                    <form th:action="@{/citizen/profile}" th:object="${profileUpdateRequest}" method="post">
                        <!-- Full Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small mt-1"></div>
                        </div>

                        <!-- Email (Read-only) -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Email Address</label>
                            <input type="email" class="form-control bg-light" th:value="${user.email}" disabled readonly>
                            <small class="text-muted">Email is your permanent login identifier.</small>
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label for="phone" class="form-label fw-semibold small">Contact Phone</label>
                            <input type="tel" class="form-control" id="phone" th:field="*{phone}" placeholder="+1 (555) 000-0000">
                        </div>

                        <!-- Address -->
                        <div class="mb-4">
                            <label for="address" class="form-label fw-semibold small">Neighborhood / Locality</label>
                            <textarea class="form-control" id="address" th:field="*{address}" rows="2" placeholder="e.g. 42 Greenfield Avenue, Ward 4"></textarea>
                        </div>

                        <button type="submit" class="btn btn-success btn-lg w-100 rounded-pill fw-bold shadow-sm">
                            <i class="fas fa-save me-2"></i> Update Profile Details
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
