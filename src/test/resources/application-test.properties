# Test Application Configuration (In-Memory H2)
spring.datasource.url=jdbc:h2:mem:civicconnect_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.upload.dir=./target/test-uploads
app.upload.allowed-types=image/jpeg,image/png,image/gif,image/webp
app.upload.max-size=5242880
app.duplicate.similarity-threshold=0.6
app.duplicate.proximity-radius-km=0.5
app.duplicate.max-results=5
app.admin.default-email=admin@civicconnect.com
app.admin.default-password=Admin@123
